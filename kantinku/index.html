<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>KantinKu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Mono:wght@500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <header class="top">
    <div class="wrap">
      <div class="brand">
        <span class="mark" aria-hidden="true"></span>
        <div><b>KantinKu</b><small>Pesan dari kelas, ambil di counter</small></div>
      </div>
      <div class="top-actions">
        <div class="seg" id="roleSeg" role="group" aria-label="Mode tampilan" hidden>
          <button type="button" data-act="role" data-role="buyer" aria-pressed="true">Pembeli</button>
          <button type="button" data-act="role" data-role="seller" aria-pressed="false">Penjual</button>
        </div>
        <button type="button" class="icon-btn" id="bell" data-act="bell" aria-label="Notifikasi">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 9a6 6 0 0 1 12 0c0 6 2 7 2 7H4s2-1 2-7" />
            <path d="M10 20a2 2 0 0 0 4 0" />
          </svg>
          <span class="dot" id="bellDot" hidden>0</span>
        </button>
      </div>
    </div>
  </header>


  <main class="wrap" id="main"></main>
  <div class="cartbar" id="cartbar"></div>
  <div class="sheet" id="sheet" hidden>
    <div class="scrim" data-act="closeSheet"></div>
    <div class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1"></div>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="js/app.js"></script>
</body>

</html>
